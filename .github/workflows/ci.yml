name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash on Windows too: cmd.exe, which runs composer.bat, takes the ^ of a constraint for an escape.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }}${{ matrix.os && format(', {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "11", testbench: "9", php: "8.2" }
          - { laravel: "11", testbench: "9", php: "8.4" }
          - { laravel: "12", testbench: "10", php: "8.2" }
          - { laravel: "12", testbench: "10", php: "8.5" }
          - { laravel: "13", testbench: "11", php: "8.3" }
          - { laravel: "13", testbench: "11", php: "8.5" }
          - { laravel: "13", testbench: "11", php: "8.5", os: macos-latest }
          - { laravel: "13", testbench: "11", php: "8.5", os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      # Laravel 11 is past its security support and each of its releases has published advisories,
      # which Composer refuses by default. Apps still run it, so the package supports it, and CI
      # installs it to test that (nothing here is deployed).
      - name: allow Laravel 11's releases
        if: matrix.laravel == '11'
        run: composer config --global audit.block-insecure false
      # The package is built next to the core's main branch, so it is tested against it; the
      # version it requires (^0.1) is what a release of both pins.
      - name: the core's main branch
        run: composer require --no-update "fixwire/fixwire:dev-main as 0.1.99"
      - name: install, on Laravel ${{ matrix.laravel }}
        run: >-
          composer update --no-progress
          --with "illuminate/contracts:^${{ matrix.laravel }}.0"
          --with "illuminate/support:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:^${{ matrix.testbench }}.0"
      - run: composer check-format
      - run: composer analyse
      - run: composer test

  example:
    name: example app against a fake ingest (also under Octane), ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, fileinfo, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
